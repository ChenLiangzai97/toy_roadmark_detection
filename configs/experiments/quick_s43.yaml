dataset:
  cache_grid: true
  cache_images: true
  camera_ids:
  - front
  input_size_hw:
  - 192
  - 320
  root: data/arrow_v1
  train_split: train
  val_split: val
eval:
  center_thresholds_m:
  - 0.5
  - 1.0
  val_limit: 600
loss:
  center_weight: 5.0
  class_weight: 1.0
  no_object_class_weight: 0.1
  orientation_weight: 1.0
model:
  attention_heads: 4
  backbone: tiny_cnn
  bev_encoder: ground_plane
  bev_range_xy:
  - 2.0
  - 18.0
  - -4.0
  - 4.0
  bev_size_hw:
  - 64
  - 32
  channels:
  - 16
  - 32
  - 64
  - 64
  decoder_layers: 2
  dropout: 0.0
  ffn_dim: 128
  hidden_dim: 64
  num_queries: 32
  use_self_attention: true
seed: 43
train:
  amp_dtype: bfloat16
  batch_size: 32
  compile: false
  device: cuda
  eval_every: 1500
  grad_clip_norm: 1.0
  log_every: 50
  lr: 0.001
  max_steps: 1500
  min_lr: 3.0e-05
  num_workers: 4
  optimizer: adamw
  persistent_workers: true
  pin_memory: true
  reserve_finalization_s: 60
  scheduler: cosine
  time_budget_s: 600
  warmup_steps: 75
  weight_decay: 0.0001
