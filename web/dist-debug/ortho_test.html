  const buf = new Uint8Array(160*320*4);

  renderer.render(scene, cam);

  renderer.setRenderTarget(null);
  let nz=0; for (let i=0;i<buf.length;i+=4) if (buf[i]||buf[i+1]||buf[i+2]) nz++;

}
